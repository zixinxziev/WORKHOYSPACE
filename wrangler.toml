name = "ahoys-workspace"
main = "src/index.js"
compatibility_date = "2026-11-03"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "ahoys-workspace-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "PROOFS"
bucket_name = "ahoys-workspace-proofs"

[vars]
APP_NAME = "Ahoy's Workspace"
