database_name = "workhoyspace_db"
database_id = "8dd054fa-8d44-4257-8c55-2a5df4712953"

[[kv_namespaces]]
binding = "PROOFS"
id = "8e1aa8e9c83746d8ab1d6cdd308fd6ec"

[vars]
APP_NAME = "Ahoy's Workspace"
